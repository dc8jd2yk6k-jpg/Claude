<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnail</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #07070a; }
  .t { position: absolute; inset: 0; overflow: hidden;
       background: radial-gradient(ellipse 60% 70% at 28% 45%, rgba(255,74,61,.38), rgba(7,7,10,0) 70%),
                   radial-gradient(ellipse 50% 60% at 85% 80%, rgba(61,224,176,.30), rgba(7,7,10,0) 70%), #07070a; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(243,239,230,.10) 1.5px, transparent 1.5px); background-size: 40px 40px; }
  .co { position: absolute; left: 56px; top: 44px; font: 800 44px "Inter Display"; letter-spacing: .06em; color: #f3efe6; }
  .co i { display:inline-block; width: 18px; height: 18px; background: #ff5a36; margin-right: 14px; vertical-align: middle; }
  .loss { position: absolute; left: 40px; top: 110px; font: 900 300px/0.95 "Inter Display"; letter-spacing: -.05em; color: #ff3d2e;
          text-shadow: 0 0 50px rgba(255,61,46,.65), 0 8px 0 #5c0d08; transform: rotate(-3deg); white-space: nowrap; }
  .tag { position: absolute; right: 54px; bottom: 60px; padding: 18px 34px; border-radius: 18px; background: #3de0b0; color: #07070a;
         font: 900 112px/1 "Inter Display"; letter-spacing: -.03em; transform: rotate(-4deg); box-shadow: 0 18px 60px rgba(61,224,176,.45); }
  svg { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div class="t">
  <div class="grid"></div>
  <div class="co"><i></i>ANTHROPIC</div>
  <div class="loss">−$80.7B</div>
  <svg width="1280" height="720" viewBox="0 0 1280 720">
    <path d="M 80 640 C 300 640 420 560 560 520 S 760 420 820 360" fill="none" stroke="#3de0b0" stroke-width="22" stroke-linecap="round"/>
    <polygon points="868,318 772,330 842,402" fill="#3de0b0"/>
  </svg>
  <div class="tag">WINNING?</div>
</div>
</body>
</html>
